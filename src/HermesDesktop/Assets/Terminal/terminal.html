<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="xterm.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
        #terminal { width: 100%; height: 100%; }

        /* Match the thin app-wide scrollbars (ControlStyles.xaml + markdown.html). */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(127, 127, 127, 0.4); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(127, 127, 127, 0.65); }
        ::-webkit-scrollbar-corner { background: transparent; }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script src="xterm.js"></script>
    <script src="xterm-addon-fit.js"></script>
    <script src="xterm-addon-webgl.js"></script>
    <script src="terminal-bridge.js"></script>
</body>
</html>
