<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
        font-size: 14px;
        line-height: 1.6;
        padding: 16px;
        color: var(--text-color, #333);
        background: var(--bg-color, #FAFAFA);
    }
    body.dark { --text-color: #CCC; --bg-color: #1E1E1E; --code-bg: #2D2D2D; --border: #3C3C3C; --link: #4FC3F7; --wikilink-bg: rgba(79,195,247,0.12); --wikilink-border: rgba(79,195,247,0.3); }
    body.light { --text-color: #333; --bg-color: #FAFAFA; --code-bg: #F5F5F5; --border: #E0E0E0; --link: #1565C0; --wikilink-bg: rgba(21,101,192,0.08); --wikilink-border: rgba(21,101,192,0.25); }
    h1, h2, h3, h4, h5, h6 { margin: 1em 0 0.5em; font-weight: 600; }
    h1 { font-size: 1.8em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
    h2 { font-size: 1.4em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
    h3 { font-size: 1.2em; }
    p { margin: 0.5em 0; }
    code { font-family: Consolas, 'Cascadia Code', monospace; background: var(--code-bg); padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
    pre { background: var(--code-bg); padding: 12px; border-radius: 6px; overflow-x: auto; margin: 0.5em 0; }
    pre code { background: none; padding: 0; }
    ul, ol { margin: 0.5em 0 0.5em 1.5em; }
    li { margin: 0.2em 0; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a.wikilink { background: var(--wikilink-bg); border: 1px solid var(--wikilink-border); border-radius: 3px; padding: 0 4px; }
    a.wikilink.missing { color: #c62828; border-color: #c62828; background: rgba(198,40,40,0.08); }
    blockquote { border-left: 3px solid var(--border); padding-left: 12px; margin: 0.5em 0; color: #888; }
    hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
    table { border-collapse: collapse; margin: 0.5em 0; width: 100%; }
    th, td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
    th { background: var(--code-bg); font-weight: 600; }
    strong { font-weight: 600; }
    em { font-style: italic; }
    img { max-width: 100%; height: auto; border-radius: 4px; }

    /* Match the thin WPF scrollbars (ControlStyles.xaml). */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(127, 127, 127, 0.4); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(127, 127, 127, 0.65); }
    body.dark ::-webkit-scrollbar-thumb { background: #3A3D44; }
    body.dark ::-webkit-scrollbar-thumb:hover { background: #5A5F68; }
    body.light ::-webkit-scrollbar-thumb { background: #C1C1C1; }
    body.light ::-webkit-scrollbar-thumb:hover { background: #A8A8A8; }
</style>
</head>
<body class="light">
<div id="content"></div>
<script src="marked.min.js"></script>
<script>
    var currentDir = "";

    var wikilinkExtension = {
        name: 'wikilink',
        level: 'inline',
        start: function(src) { return src.indexOf('[['); },
        tokenizer: function(src) {
            var match = /^\[\[([^\]\|\n]+?)(?:\|([^\]\n]+?))?\]\]/.exec(src);
            if (match) {
                return {
                    type: 'wikilink',
                    raw: match[0],
                    target: match[1].trim(),
                    text: (match[2] || match[1]).trim(),
                };
            }
        },
        renderer: function(token) {
            var target = String(token.target).replace(/"/g, '&quot;').replace(/</g, '&lt;');
            var text = String(token.text).replace(/</g, '&lt;');
            return '<a href="#" class="wikilink" data-target="' + target + '">' + text + '</a>';
        }
    };

    function rewriteImageSrc(src) {
        if (!src) return src;
        if (/^(https?:|data:|blob:)/i.test(src)) return src;
        if (src.charAt(0) === '/') {
            return 'https://hermes.wikiassets' + src;
        }
        var prefix = currentDir ? currentDir + '/' : '';
        return 'https://hermes.wikiassets/' + prefix + src;
    }

    function escapeAttr(value) {
        return String(value).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    var customRenderer = {
        image: function(token) {
            var href = (token && token.href) || '';
            var title = (token && token.title) || '';
            var text = (token && token.text) || '';
            var src = rewriteImageSrc(href);
            var attr = ' src="' + escapeAttr(src) + '" alt="' + escapeAttr(text) + '"';
            if (title) attr += ' title="' + escapeAttr(title) + '"';
            return '<img' + attr + '/>';
        },
        link: function(token) {
            var href = (token && token.href) || '';
            var title = (token && token.title) || '';
            var text = (token && token.text) || '';
            var attr = ' href="' + escapeAttr(href) + '"';
            if (title) attr += ' title="' + escapeAttr(title) + '"';
            // External links open via host; for now, just render and we handle in click
            attr += ' target="_blank" rel="noopener"';
            return '<a' + attr + '>' + text + '</a>';
        }
    };

    marked.use({ extensions: [wikilinkExtension], renderer: customRenderer });

    function renderMarkdown(base64Content, dir, isDark) {
        currentDir = dir || "";
        document.body.className = isDark ? 'dark' : 'light';
        try {
            var text = decodeURIComponent(escape(atob(base64Content)));
            document.getElementById('content').innerHTML = marked.parse(text);
        } catch (e) {
            document.getElementById('content').innerText = 'Error rendering markdown: ' + e.message;
        }
    }

    document.addEventListener('click', function(e) {
        var el = e.target;
        while (el && el !== document.body) {
            if (el.classList && el.classList.contains('wikilink')) {
                e.preventDefault();
                var target = el.getAttribute('data-target');
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage({ type: 'wikilink', target: target });
                }
                return;
            }
            if (el.tagName === 'A') {
                var href = el.getAttribute('href') || '';
                if (href && !/^(https?:|mailto:|#)/.test(href)) {
                    e.preventDefault();
                    return;
                }
                if (/^https?:/.test(href)) {
                    e.preventDefault();
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage({ type: 'externalLink', href: href });
                    }
                    return;
                }
            }
            el = el.parentNode;
        }
    });
</script>
</body>
</html>
